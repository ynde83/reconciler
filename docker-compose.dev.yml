version: '3.8'

services:
  minio:
    image: minio/minio:RELEASE.2024-01-11T06-46-16Z
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 5

  mc-init:
    image: minio/mc:RELEASE.2024-01-11T05-59-54Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until mc alias set myminio http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing myminio/datasets;
      mc mb --ignore-existing myminio/models;
      exit 0;
      "

  nats:
    image: nats:2.10-alpine
    ports:
      - "4222:4222"
      - "8222:8222"
    command: "-js -sd /data"
    volumes:
      - nats_data:/data

volumes:
  nats_data:
